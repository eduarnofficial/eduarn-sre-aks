apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      # Prometheus
      - job_name: "prometheus"

        static_configs:
          - targets:
            - localhost:9090

      # Nginx Exporter
      - job_name: "nginx-exporter"

        metrics_path: /metrics

        static_configs:
          - targets:
            - nginx-exporter:9113

      # Node Exporter
      - job_name: "node-exporter"

        metrics_path: /metrics

        static_configs:
          - targets:
            - node-exporter:9100

      # cAdvisor
      - job_name: "cadvisor"

        metrics_path: /metrics

        static_configs:
          - targets:
            - cadvisor:8080
