apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: sre-demo

  labels:
    app: prometheus

spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        ports:
        - containerPort: 9090

        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus/"

        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus

      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config


      - name: prometheus-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:

  name: prometheus
  namespace: sre-demo
  labels:

    app: prometheus


spec:
  type: ClusterIP
  selector:
    app: prometheus


  ports:
  - name: http
    port: 9090

    targetPort: 9090
