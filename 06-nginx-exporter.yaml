apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-exporter
  namespace: sre-demo

  labels:
    app: nginx-exporter


spec:

  replicas: 1


  selector:

    matchLabels:

      app: nginx-exporter


  template:


    metadata:

      labels:

        app: nginx-exporter


    spec:


      containers:


      - name: nginx-exporter


        image: nginx/nginx-prometheus-exporter:1.3.0


        args:


        - "-nginx.scrape-uri=http://nginx/nginx_status"


        ports:


        - containerPort: 9113


---


apiVersion: v1
kind: Service


metadata:

  name: nginx-exporter

  namespace: sre-demo


  labels:

    app: nginx-exporter


spec:


  type: ClusterIP


  selector:


    app: nginx-exporter


  ports:


  - name: metrics

    port: 9113

    targetPort: 9113
