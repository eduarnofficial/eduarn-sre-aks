apiVersion: v1
kind: ConfigMap

metadata:

  name: nginx-config

  namespace: sre-demo


data:

  nginx.conf: |

    worker_processes auto;


    events {

      worker_connections 1024;

    }


    http {


      include       mime.types;

      default_type  application/octet-stream;


      server {


        listen 80;


        server_name localhost;


        location / {


          root /usr/share/nginx/html;

          index index.html;


        }


        # Nginx metrics endpoint

        location /nginx_status {


          stub_status on;


          allow all;


        }


      }

    }
